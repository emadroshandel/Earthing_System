# Runs the test suite and the independent formula audit on every push and
# pull request (1.8.8).  A red mark on GitHub means a change broke a result
# that the suite checks against a published value or an independent solution.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.21" pytest
      - name: Independent formula audit
        run: python audit.py
      - name: Test suite
        env:
          ES_WORKERS: "2"
        run: python -m pytest -q tests
